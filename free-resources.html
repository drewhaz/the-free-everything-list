<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --muted: #7a7a9a;
    --accent: #7c6dfa;
    --accent2: #fa6d9a;
    --accent3: #6dfabc;
    --accent4: #facc6d;
    --accent5: #6db4fa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 20% 10%, rgba(124,109,250,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 80%, rgba(250,109,154,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* Header */
  header {
    padding: 60px 0 40px;
    text-align: center;
    position: relative;
  }

  .eyebrow {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(42px, 8vw, 88px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s forwards;
  }

  h1 span { color: var(--accent); }
  h1 em { font-style: italic; color: var(--accent2); }

  .subtitle {
    font-size: 17px;
    color: var(--muted);
    max-width: 500px;
    margin: 0 auto 40px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.2s forwards;
  }

  .stats {
    display: flex;
    gap: 32px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.3s forwards;
  }

  .stat {
    text-align: center;
  }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--accent3);
  }
  .stat-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Search */
  .search-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.4s forwards;
  }

  .search-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px 12px 44px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
    pointer-events: none;
  }

  .filter-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Results bar */
  .results-bar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 24px 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* Main content */
  main { padding: 40px 0 80px; }

  .section {
    margin-bottom: 48px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s, transform 0.5s;
  }

  .section.visible { opacity: 1; transform: none; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .section-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .section-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 20px;
  }

  /* Cards grid */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.2s;
    border-radius: 12px;
  }

  .card:hover {
    border-color: var(--card-accent, var(--accent));
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .card:hover::before { opacity: 0.04; background: var(--card-accent, var(--accent)); }

  .card-favicon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    overflow: hidden;
  }

  .card-favicon img {
    width: 20px;
    height: 20px;
    object-fit: contain;
  }

  .card-info { flex: 1; min-width: 0; }

  .card-name {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-url {
    font-size: 11px;
    color: var(--card-accent, var(--accent));
    margin-top: 4px;
    opacity: 0.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge-new {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--accent2);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* No results */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    display: none;
  }

  .no-results h3 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    margin-bottom: 8px;
    color: var(--text);
  }

  /* Back to top */
  .back-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    background: var(--accent);
    border-radius: 50%;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    z-index: 200;
  }

  .back-top.show { opacity: 1; transform: none; }
  .back-top:hover { background: #6355e0; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }

  /* Section color themes */
  .theme-purple { --card-accent: var(--accent); }
  .theme-pink { --card-accent: var(--accent2); }
  .theme-green { --card-accent: var(--accent3); }
  .theme-yellow { --card-accent: var(--accent4); }
  .theme-blue { --card-accent: var(--accent5); }

  @media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; }
    h1 { font-size: 42px; }
    .filter-chips { display: none; }
  }
</style>
</head>

const textColors = {
  "theme-purple": "#a090ff",
  "theme-pink": "#ff90b8",
  "theme-green": "#70ffb8",
  "theme-yellow": "#ffd970",
  "theme-blue": "#70c0ff"
};

let activeFilter = "All";
let searchQuery = "";

function buildUI() {
  const wrap = document.getElementById("sectionsWrap");
  const chipWrap = document.getElementById("filterChips");
  const categories = Object.keys(DATA);

  // Stats
  let total = 0;
  categories.forEach(c => total += DATA[c].items.length);
  document.getElementById("totalCount").textContent = total + "+";
  document.getElementById("catCount").textContent = categories.length;

  // All chip
  const allChip = document.createElement("button");
  allChip.className = "chip active";
  allChip.textContent = "All";
  allChip.onclick = () => setFilter("All");
  chipWrap.appendChild(allChip);

  // Category chips
  categories.forEach(cat => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = DATA[cat].icon + " " + cat;
    chip.setAttribute("data-cat", cat);
    chip.onclick = () => setFilter(cat);
    chipWrap.appendChild(chip);
  });

  // Sections
  categories.forEach(cat => {
    const { icon, theme, items } = DATA[cat];
    const sec = document.createElement("div");
    sec.className = "section " + theme;
    sec.setAttribute("data-category", cat);

    const hdr = document.createElement("div");
    hdr.className = "section-header";

    const iconEl = document.createElement("div");
    iconEl.className = "section-icon";
    iconEl.style.background = bgColors[theme] || "#1a1a2a";
    iconEl.textContent = icon;

    const titleEl = document.createElement("div");
    titleEl.className = "section-title";
    titleEl.textContent = cat;

    const countEl = document.createElement("div");
    countEl.className = "section-count";
    countEl.textContent = items.length + " tools";

    hdr.appendChild(iconEl);
    hdr.appendChild(titleEl);
    hdr.appendChild(countEl);
    sec.appendChild(hdr);

    const grid = document.createElement("div");
    grid.className = "cards";

    items.forEach(item => {
      const card = document.createElement("a");
      card.className = "card";
      card.href = "https://" + item.url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.setAttribute("data-name", item.name.toLowerCase());
      card.setAttribute("data-desc", item.desc.toLowerCase());
      card.setAttribute("data-url", item.url.toLowerCase());
      card.style.setProperty("--card-accent", textColors[theme] || "var(--accent)");

      const favicon = document.createElement("div");
      favicon.className = "card-favicon";
      favicon.style.background = bgColors[theme] || "#1a1a2a";
      const img = document.createElement("img");
      img.src = "https://www.google.com/s2/favicons?domain=" + item.url + "&sz=32";
      img.onerror = () => { favicon.textContent = icon; };
      favicon.appendChild(img);

      const info = document.createElement("div");
      info.className = "card-info";

      const name = document.createElement("div");
      name.className = "card-name";
      name.textContent = item.name;

      const desc = document.createElement("div");
      desc.className = "card-desc";
      desc.textContent = item.desc;

      const url = document.createElement("div");
      url.className = "card-url";
      url.textContent = item.url;

      info.appendChild(name);
      info.appendChild(desc);
      info.appendChild(url);
      card.appendChild(favicon);
      card.appendChild(info);

      if (item.new) {
        const badge = document.createElement("span");
        badge.className = "badge-new";
        badge.textContent = "New";
        card.appendChild(badge);
      }

      grid.appendChild(card);
    });

    sec.appendChild(grid);
    wrap.appendChild(sec);
  });

  // Intersection observer for animations
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
  }, { threshold: 0.05 });

  document.querySelectorAll(".section").forEach(s => obs.observe(s));
}

function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll(".chip").forEach(c => {
    c.classList.toggle("active",
      c.textContent === "All" ? cat === "All" : c.getAttribute("data-cat") === cat
    );
  });
  filterRender();
}

document.getElementById("searchInput").addEventListener("input", e => {
  searchQuery = e.target.value.toLowerCase().trim();
  filterRender();
});

function filterRender() {
  const sections = document.querySelectorAll(".section");
  let totalVisible = 0;

  sections.forEach(sec => {
    const cat = sec.getAttribute("data-category");
    const catMatch = activeFilter === "All" || activeFilter === cat;

    if (!catMatch) { sec.style.display = "none"; return; }

    const cards = sec.querySelectorAll(".card");
    let visCount = 0;

    cards.forEach(card => {
      const matches = !searchQuery ||
        card.getAttribute("data-name").includes(searchQuery) ||
        card.getAttribute("data-desc").includes(searchQuery) ||
        card.getAttribute("data-url").includes(searchQuery);
      card.style.display = matches ? "" : "none";
      if (matches) visCount++;
    });

    sec.style.display = visCount === 0 ? "none" : "";
    totalVisible += visCount;
  });

  const bar = document.getElementById("resultsBar");
  const noRes = document.getElementById("noResults");

  if (totalVisible === 0) {
    noRes.style.display = "block";
    bar.textContent = "";
  } else {
    noRes.style.display = "none";
    if (searchQuery || activeFilter !== "All") {
      bar.textContent = totalVisible + " result" + (totalVisible !== 1 ? "s" : "");
    } else {
      bar.textContent = "";
    }
  }
}

// Back to top
window.addEventListener("scroll", () => {
  document.getElementById("backTop").classList.toggle("show", window.scrollY > 400);
});

buildUI();
</script>
</body>
</html>
